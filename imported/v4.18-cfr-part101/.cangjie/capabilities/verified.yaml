    frontmatter:
      description: |
        何时用：判免的是哪一条义务（§101.100 配料表 / §101.9(j) 营养标签 / §101.108 实验 / Part 117 主体豁免）、incidental additives 与亚硫酸盐 10 ppm、§101.108 书面提案、403 vs 402、七套编号与二十二类不可混引、should/must 分层。何时不用：**本卡是横切口径层，不单独抢路由**，须依附 V01–V04 业务卡；不代写法律文书、不出合规结论、不判产品法定身份；不判 Part 117 主体豁免细则（→CAP-09）、不判指南 should 对企业是否必须做（→CAP-14）。Trigger「§101.100 是不是免营养标签」「标签合规是不是就安全」「guidance 能不能当豁免依据」；EN: "exemption", "incidental additives", "sulfites", "misbranding vs adulteration".
