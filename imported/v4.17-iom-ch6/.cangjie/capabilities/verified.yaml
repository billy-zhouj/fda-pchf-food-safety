  - capability_id: "cap.iom2026ch6.admission-status-concept-tree"
    revision: 1
    status: active
    slug: "admission-status-concept-tree"
    title: "进口状态概念区分树（放行 / 扣留 / 条件放行）"
    importance: high
    importance_rationale: |
      本轮唯一允许 glossary 独立成能力卡的例外：这组术语本身构成判定框架
      （用户明确点名「扣留/放行/条件放行」概念区分树）。它是消除「二十一类不可混引」
      的口径前置层，直接决定企业能否把某状态理解为「可分销」；但不产出业务判定，
      故不列 critical 且须依附业务卡使用。
    one_liner: "先把状态词归位：Conditional Release 是等待判定的状态（可移动不可分销、附 3 倍货值 bond），May Proceed / Release / IB Release / Release with Comment 是四种法律含义不同的放行，Detention 临时可回转，Refusal 终局但非终点；三个『30 天』与一个『90 天』分属不同窗口。"
    intents:
      - "判断某个 FDA 状态词到底意味着『能不能分销』"
      - "区分 May Proceed / Release / IB Release / Release with Comment 四种放行"
      - "区分 Conditional Release 与 May Proceed（等待状态 vs 结束该状态的决定）"
      - "区分 Detention（临时）与 Refusal（终局但非终点）"
      - "区分三个 30 天与一个 90 天窗口"
      - "判断『货可以移动』是否等于『货可以销售』"
    keywords: ["May Proceed", "Release", "IB Release", "Release with Comment", "Conditional Release", "Detention", "Refusal of Admission", "No compliance decision has been made", "可移动不可分销", "三个30天", "90 days", "AGR", "Re-export", "概念区分树", "同形异义 IB"]
    also_read:
      - slug: "iom-effect-level-modality"
        relation: "contrasts-with 对比"
        note: "同为不产出业务判定的前置层：V09 是术语口径层（回答状态词意味着什么、能否分销），V10 是法律位阶与情态判读层；二者都服务「不可混引」但约束不同（V10 相邻混淆）"
    card: "cards/admission-status-concept-tree.md"
    frontmatter:
      description: |
        何时用：判某个 FDA 状态词意味着「能不能分销」；区分 May Proceed / Release / IB Release / Release with Comment 四种放行；Detention 与 Refusal 分界；三个 30 天与一个 90 天。何时不用：口径前置层不产出动作（→V01）、不算倒计时（→V04）、不认定违规（→V07），须依附业务卡。Trigger 中「这个状态能不能卖货」「放行有几种」「30 和 90 天怎么分」；EN: "May Proceed", "Release", "IB Release", "Conditional Release".
    promotion:
