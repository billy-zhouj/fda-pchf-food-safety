        note: "Conditional Release / FTH 术语定义归 V09；本卡不定义状态词、不算条件放行期倒计时（V07 overlap_risk / differentiator）"
    card: "cards/failure-to-hold-investigation.md"
    frontmatter:
      description: |
        何时用：判条件放行货物是否已构成 Failure to Hold（要件「无放行而分销」而非「移出港区」）；8 步取证、①–⑤ 作成 affidavit；健康危害/DWPE 是否追加召回、公共警告；4647 用 30 天还是 90 天；Substitution 查明前按 FTH 处理。何时不用：不算条件放行期（→V04）、不定义状态词（→V09）。Trigger 中「没出港区算不算违规」「8 步调查」「4647 是 30 还是 90 天」；EN: "Failure to Hold", "distribution without a release", "8 steps".
