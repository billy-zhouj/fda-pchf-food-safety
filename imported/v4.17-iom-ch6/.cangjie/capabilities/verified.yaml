      - "IOM 6.9.30 [p.53]：术语表逐字复述定义并指向 redelivery bond"
      - "IOM 6.9.13 [p.51]：The goods may be moved but CBP can request redelivery within 30 days"
      - "IOM 6.6.4.4 [p.44]：Substitution 在查明前一律按『实际货物无 FDA 放行而分销』处理，回指 6.6.4.1"
