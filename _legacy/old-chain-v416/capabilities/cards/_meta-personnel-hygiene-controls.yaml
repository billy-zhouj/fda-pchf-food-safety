slug: personnel-hygiene-controls
title: 人员卫生控制
importance: extended
importance_rationale: 人员是 RTE 食品环境病原最不稳定的一道防线，触发语境（手套/鞋履/工服/动线/承包商）与设备侧完全不同，具备独立意图与独立契约，故单列能力卡
one_liner: 手套不是万能——接触非食品接触面即须更换；人员控制的失效不体现为"没人洗手"，而体现为手套戴到污染、工服穿回 RTE 区、泡脚器被绕过去
intents:
  - 制定 RTE 区进入人员的手部与手套更换触发规则
  - 按干湿环境选型泡脚器/泡沫消毒器/干粉消毒剂，并设计防绕过与失效巡检
  - 工服分区专用、每日洗涤处置与按任务色码区分
  - 物理分隔不切实际时用动线环境监测、captive shoe 与进入顺序管理替代
  - 维修人员、卫生人员与废弃物接触人员的额外卫生要求
  - 把人员卫生的依从性纳入环境监测与培训矩阵
keywords:
