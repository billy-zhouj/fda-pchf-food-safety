slug: reference-tools-discipline
title: 权威参考表与数据使用纪律
importance: extended
importance_rationale: 附录工具是全书证据体系的输入端，X 标记三问检验/禁内插/模型须验证是高频踩坑点，但依附于危害分析与工艺控制两卡使用。
one_liner: 参考表是先验起点不是答案——X 标记过三问检验，数值禁线性内插取更严档，模型输出须自身验证后才可当关键限值。
intents:
  - 判断附录 1 危害表 X 标记能否直接用于自家产品
  - 评估生长极限表/速查数值能否作为设计依据或关键限值
  - 处理 PMP/ComBase 等预测模型输出的使用边界
  - 附录查不到的新原料/特殊配料如何补齐危害评估
  - 判断危害清单是否随配料状态与下游用途变化
  - 数据不足时能否以"表里没有"结案、概率评估该不该扣掉现有控制
keywords:
