slug: chemical-hazard-controls
title: 化学危害与食品欺诈控制
importance: core
importance_rationale: 化学危害归途分流+人群锚定+掺假分诊是本书区别于通用 HACCP 独立价值最高的两块之一，13 个成员单元跨 Ch2/3/11/12/15 五章支撑。
one_liner: 化学危害按引入路径分流（设施→CGMP、原料→供应链、工艺→工艺控制），掺假签名一匹配即按欺诈处置、不看数值。
intents:
  - 判断重金属/农药残留/真菌毒素等化学危害该走 CGMP、供应链还是工艺控制
  - 设计婴幼儿等易感人群产品的毒元素分层控制与检测频次
  - 检测出异常值（疑似掺假/超标）时决定放行、降级还是断供
  - 跟踪行动水平/进口警报等监管标准变化并同步采购规格
  - 为有掺假史的国别或品类（香料/乳制品）做 EMA 危害判定
  - defect 与掺假的法定分界（掺混稀释是否合法、消杀药剂存放合规）
