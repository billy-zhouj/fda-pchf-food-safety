slug: environmental-engineering-controls
title: 厂房与设备工程控制
importance: extended
importance_rationale: 面向 RTE 食品厂房新建/改造与设备选型的结构性控制，受众窄于危害分析等核心卡，但工程缺陷无法由清洁与监测弥补，属一次性决策的高价值能力
one_liner: 厂房怎么建、设备怎么造决定污染上限——清洁只能维持设计给的水平，气流压差、排水、材质与可清洁性必须在设计阶段一次到位
intents:
  - 新建或改造 RTE 车间时确定物理分区、气流压差与空气过滤规格
  - 判定排水沟、地漏、冷凝水与给水系统的设计是否会把污染带进 RTE 区
  - 设备选型与验收：食品接触面材质、密封、可排空、无死端，非 FCS 结构件不得空心
  - 施工或改造期间的分级污染控制措施
  - 压缩空气与直接接触食品的气体、托盘与周转容器的专用化要求
  - 预防性维护程序与维护记录应列明的具体部件清单
  - 用潜在污染源清单与污染场景推演排查工艺后再污染的工程入口
