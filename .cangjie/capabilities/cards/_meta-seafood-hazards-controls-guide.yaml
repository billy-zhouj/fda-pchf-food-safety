source_label: >-
  第 15 类来源：FDA《Fish and Fishery Products Hazards and Controls Guidance》
  第 4 版 June 2022（SGR 129，U.S. FDA / HHS / PHS / CFSAN / Office of Food Safety,
  Division of Seafood Safety），本地文件 source-seafood-hazards-guide-2022.md，
  导出全文 1,709,446 字节 / 约 31,321 行。属非约束性 Guidance for Industry：
  should 只表示建议或推荐、不设可依法强制执行的责任，可另选控制策略与关键限值但须
  科学论证其充分性，Ch.3 三表不得单独使用、指南不替代加工者自行实施的危害分析。
  它是 21 CFR Part 123 与 Part 1240 的配套技术指南层，与 CAP-22 的 21 CFR Part 123
  法条义务层配对而非合并。仍未收清单：CP 7303.842 海产品检查程序、NSSP Guide、
  21 CFR part 120 / 1240 / 108 / 110 / 507 正文、Import Alert 16-xx 系列、
  BAM 海产品章节，以及 Appendix 5 回指的 CPG Sec. 540.525 / 555.300 / 575.100、
  21 CFR 556 系列、40 CFR 180 系列、Import Tolerance 等外部法源 —— 一律标转引未收。
