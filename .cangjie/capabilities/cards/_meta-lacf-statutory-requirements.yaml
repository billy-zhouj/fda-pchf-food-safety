slug: lacf-statutory-requirements
title: 低酸罐头与酸化食品的法定要求（21 CFR Part 113 / 114 法规正文）与 Part 117 并行接口
importance: extended
importance_rationale: 本包自 v1 起只有 21 CFR Part 117 一套法规正文，涉及 LACF/AF 的法条一律只能标「转引未收」，v4.6 的 CAP-19 更是靠 CP 7303.070 反推义务。用户随后提供 21 CFR Part 113 / 114（4-1-25 Edition）正文，本卡首次把 Part 117 之外的法规正文纳入，直接改变全包效力分层表述（「Part 117 是唯一法定义务基准」须收窄为「判定 Part 117 义务的唯一基准」）。它同时钉死四处高频误读：① 把 §117.5(d)(1) 读成「LACF 自动免 PCHF」（实为双条件 + 仅限微生物危害）；② 以为酸化食品有对应豁免（§117.5 清单无 part 114，且 §114.5 反向把 parts 110 and 117 拉进掺假判定）；③ 把 CP 7303.070 的 4.40/4.65/24 罐实验室触发线当法定放行值；④ 沿用 v4.3「Part 110 已移除、110.110 是过时引用」的错误结论（FDA 2018-09-12 已撤回删除指令）。属入口型法条判定能力，与 CAP-19 及 hazard-analysis-method / regulatory-boundaries / cgmp-compliance-guide / defect-action-levels / process-control-validation 多卡交叉，故定 extended。
one_liner: 先用成品平衡 pH 与 aw 按〔§ 113.3(n)〕〔§ 114.3(b)(d)〕定 LACF / AF 身份，再按〔§ 117.1(c)〕并行 + 〔§ 117.5(d)(1)(2)〕双条件有限豁免切出 PCHF 义务并集；酸化食品不免 Subparts C/G；法条里是 4.6 / 0.85 / 4.0 与 1+2 年记录，不是 CP 的 4.40 / 4.65 / 24 罐；Part 108 自 v4.12 起已收（手续层见 CAP-25），part 110 正文仍未收。
intents:
  - 按成品平衡 pH 与 aw 判定产品属于 LACF、酸化食品、酸性食品还是 §114.3(b) 排除项
  - 解释〔§ 117.1(c)〕专项 CGMP 与 Part 117 并行不互斥，纠正「二选一」误读
  - 按〔§ 117.5(d)(1)〕的 required to comply with 且 in compliance with 双条件判断豁免是否成立
  - 按〔§ 117.5(d)(2)〕把豁免限定在 part 113 管辖的微生物危害，指出化学/物理/金葡等危害仍归 Subparts C/G
  - 说明 part 114 不在 §117.5 豁免清单内，酸化食品全程受 Subparts C/G 约束
  - 解释〔§ 114.5〕并列 parts 110 and 117 用于判定掺假，且该文本现行有效不是笔误
  - 复述〔§ 113.3(n)〕〔§ 114.3(b)(d)〕的 4.6 / 0.85 法定身份边界与番茄 pH <4.7 例外
  - 列出 Part 113 的企业义务：§113.5 CGMP 判据、§113.10 人员、§113.40 设备与 NIST 校准、§113.60 容器、§113.81 产品制备、§113.83 scheduled process、§113.87 杀菌室、§113.89 偏差、§113.100 记录
  - 列出 Part 114 的企业义务：§114.5 掺假判据、§114.10 人员、§114.80 成品 pH 与热处理、§114.83 scheduled process、§114.89 三条偏差路径、§114.90 方法、§114.100 记录
  - 回答成品 pH >4.0 必须用 potentiometric method〔§ 114.80(a)(2)〕及 §113.81(e) 回指 §114.90 的关系
  - 说明酸化不等于免除热处理〔§ 114.80(a)(1)〕及 §114.89(b) 按 part 113 热处理的条文接口
  - 区分〔§ 113.10〕与〔§ 114.10〕BPCS 课程覆盖领域的差异
  - 回答 FDA 调阅 scheduled process 的法条依据〔§ 113.87(b)〕，并与 IOM 记录索取程序分层
  - 分列两 part 的记录保存口径：〔§ 113.100(g)〕厂内 ≥1 年 + 另 2 年且 (h) 允许 part 11 电子记录；〔§ 114.100(e)〕整段 3 年、无分段、无 part 11 条款
  - 纠正 v4.3「Part 110 已移除 / 110.110 是过时引用」结论，给出 2018-09-12 FR Doc 2018-19855 撤回 instruction 13 的事实链
  - 说明手册那句是 §110.110(c) 意译而非〔§ 117.110(c)〕，且理由已从「part 110 已删」更正为「那是 part 110 的 (c) 款」
  - 区分法定数字 4.6/0.85/4.0、CP 7303.070 检查员触发线 4.40/4.65/4.75/0.90/0.93/1%/24 罐、L.mono 建议层 ≤4.4/≤0.92
  - 识别 4-1-25 Edition 是 CFR 年度编纂版次而非 2025 新规，FR citation 才是修订出处
  - 判断哪些问题超出本卡（part 110/120 正文、F0-D-z 计算、BAM、IOM Ch.4、Import Alert 全文）；part 108 的 FCE 注册/SID 备案/Emergency Permit 自 v4.12 起已收，转 CAP-25
