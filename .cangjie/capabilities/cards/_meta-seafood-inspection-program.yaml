source_label: >-
  第 16 类来源：FDA《Compliance Program Guidance Manual 7303.842 — Seafood Processor,
  Products, and Importer Inspection Program》，2023-11-01 版程序的 2025-09-30 更正本，
  本地文件 source-cp-7303-842-2023.md（用户提供的官方 508-Compliant PDF，80 物理页 /
  148 书签 / 首页标 Page 1 of 86，经用户级技能 pdf2md-pro 转换，正文 179,812 字节 /
  1,334 行）。属给 FDA 检查员、进口分区、分部合规官与实验室的**内部作业指导层**：
  非法规、非 Guidance for Industry、不创设企业义务；文件名 20250929 只是 PDF 生成日。
  CP 7303.842 与 CP 7303.844 已合并为单一程序，但 PAC 仍分进口与国产。它是 21 CFR Part 123
  法条义务层（CAP-22）与 Fish and Fishery Products Hazards and Controls Guidance 第 4 版
  技术指南层（CAP-23）之外的第三层。仍未收清单：CPG Sec. 540.525 / 540.370 / 555.600 /
  562.300 / 540.250 / 540.590 全文、21 CFR part 120 / 1240 / 108 / 110 / 507 正文、
  NSSP Guide 与 Model Ordinance、BAM / AOAC / LIB / MPM 方法全文、Import Alert 16-74 /
  16-20 / 99-41 全文、21 CFR part 1 subpart L、IOM Chapter 4、FDA 3501 / 3502 表单全文、
  Seafood List、eNSpect / CMS / FACTS 内部系统、FDA 与 NMFS 的 MOU —— 一律标转引未收。
