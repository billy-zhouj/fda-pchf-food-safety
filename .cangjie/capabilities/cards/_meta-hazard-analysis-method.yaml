slug: hazard-analysis-method
title: 危害分析方法
importance: core
importance_rationale: 全书方法论核心（Ch2）与所有示例厂的共同起点，其他能力的地基；图入度最高
one_liner: 用六列工作表把危害从识别到控制落点做成可辩护的书面推演——"No"与"Yes"同等重要，发现点不等于控制点
intents:
  - 给新产品/新产线做危害分析或重建六列工作表
  - 判断某个危害要不要写进 FSP、要不要设预防控制
  - 解释附录 1 的 X 标记怎么用、能不能判 No
  - 把 HACCP 计划升级为 FSP 危害分析
  - 出现新信息（原料/工艺/暴发通报）后判断危害分析是否要重做
  - 判断某情形法定是否违法/是否必须设预防控制（条款级判定）
