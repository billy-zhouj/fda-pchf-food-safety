slug: seafood-haccp-statutory-requirements
title: 海产品 HACCP 的法定要求（21 CFR Part 123 法规正文）与 Part 117 条件性豁免接口
importance: extended
importance_rationale: 本包此前讲水产品只能靠 CP 7303.842 反推义务，而该 CP 正文亦未收，凡涉 21 CFR 123 一律只能标「转引未收」。用户随后提供 21 CFR Part 123（4-1-25 Edition，9 页 / 13 条款）正文，本卡首次把水产品法条纳入，使全包「法规正文层」扩至 Part 117 / 113 / 114 / 123 四套独立编号。它同时钉死五处高频误读：① 以为水产品只按 part 123 管而不知〔§ 123.5(a)〕`Except as provided by § 117.5(b), parts 110 and 117 ... apply` 是默认适用；② 把〔§ 117.5(b)〕的豁免套用 part 113 的〔§ 117.5(d)(2)〕「仅限微生物危害」限缩（part 123 无此款，两个方向都会错）；③ 把〔§ 123.15〕〔§ 123.20〕的 `augments subpart A` 读成替代而漏 Subpart A 全套义务；④ 把〔§ 123.12〕的进口商验证与 FSVP 混为一套；⑤ 把记录期写成统一 3 年（实为〔§ 123.9(b)(1)〕冷藏 1 年 / 冷冻-保藏-货架稳定 2 年，与 Part 113 的 1+2、Part 114 的整段 3 年是三套口径）。属入口型法条判定能力，与 CAP-20 / CAP-19 / CAP-21 / CAP-07 / hazard-analysis-method / regulatory-boundaries / chemical-hazard-controls 多卡交叉，故定 extended。
one_liner: 先按〔§ 123.3(d)(e)(k)〕定 fish / fishery product 与 processing 范围，再按〔§ 123.5(a)〕默认适用 + 〔§ 117.5(b)〕双条件豁免切出义务并集；Subpart B/C 是 augments 叠加；§123.16 的例外只排一条不排整 part；§123.12 与 FSVP 是双轨互不替代；记录期是 1 年 / 2 年而非统一 3 年；part 120/1240/NSSP 正文仍未收；CP 7303.842 自 v4.11 起已收（检查程序层，转 CAP-24），仍不得反推法条。
intents:
  - 判定某产品是否属〔§ 123.3(d)〕fish 或〔§ 123.3(e)〕fishery product，以及某活动是否属〔§ 123.3(k)〕processing
  - 列举〔§ 123.3(k)(2)〕三项排除（纯捕捞或运输、船上暂存处理、零售经营）
  - 解释〔§ 123.5(a)〕Part 110/117 默认适用且 §117.5(b) 是唯一例外出口
  - 按〔§ 117.5(b)〕的 required to comply with 且 in compliance with 双条件判断豁免是否成立
  - 指出〔§ 117.5(b)〕没有 part 113〔§ 117.5(d)(2)〕那样的微生物危害限缩款，两个方向的误读都要纠正
  - 说明〔§ 117.5(b)〕只免 Subparts C/G，Part 117 Subpart B 的 CGMP 不在豁免内
  - 解释〔§ 123.15〕〔§ 123.20〕的 augments subpart A 是叠加不是替代
  - 列 Subpart A 的企业义务：§123.6 危害分析与 HACCP 计划、§123.7 纠正措施、§123.8 验证、§123.9 记录、§123.10 培训、§123.11 卫生控制
  - 列出〔§ 123.6(c)(1)〕(i)–(ix) 九项危害考虑清单并说明 should be given 的性质
  - 回答寄生虫危害何时构成 RTL〔§ 123.6(c)(1)(vii)〕的三个条件
  - 复述鲭鱼毒素种定义〔§ 123.3(m)〕与分解类危害
  - 说明〔§ 123.7〕纠正措施三条法定路径与 (c)(1)–(c)(5) 顺序
  - 回答 CCP 监控与纠正措施记录须在 1 周内复审〔§ 123.8(a)(3)(i)(ii)〕
  - 回答 HACCP 计划复审频率为变更时及至少每年一次，且不足时须立即修改〔§ 123.8(a)(1)〕
  - 分列〔§ 123.9(b)(1)〕冷藏 1 年 / 冷冻-保藏-货架稳定 2 年、(b)(2) 适宜性记录 2 年、(b)(3) 季末转移、(f) 电子记录
  - 说明记录须在观察当时填写〔§ 123.9(a)(4)〕
  - 区分〔§ 123.9(e)〕Tag 不受记录条约束除非用于满足 §123.28(c)
  - 说明培训可由课程等效或岗位经验满足且不必是本单位员工〔§ 123.10〕
  - 区分〔§ 123.11(a)〕SSOP 的 should 与 (b)(c) 监测记录的 shall，并按〔§ 123.3(n)(q)〕给措辞钥匙
  - 列出〔§ 123.11(b)〕八项卫生监测条件与 (d) 与 HACCP 计划可互补不必重复
  - 解释熏制水产品肉毒控制〔§ 123.16〕覆盖货架期，且 exception 只排 part 113/114 管辖者
  - 说明双壳贝类源头控制〔§ 123.28〕(b) approved growing waters、(c) shellstock 采捕许可与 tag 五要素、(d) shucked 标签符合 §1240.60(c)
  - 解释〔§ 123.12〕进口商二选一（MOU 或书面验证程序）与 (a)(2)(ii)(A)–(F) affirmative steps
  - 说明 competent third party 可代写验证程序〔§ 123.12(b)〕与英文记录要求〔§ 123.12(c)〕
  - 说明§123.12(d) 无等效保证即视为掺假并拒绝入境
  - 区分 §123.12 进口商验证与 FSVP 是两套法源两套结构，deemed compliance 不覆盖 §123.12
  - 判断水产品同时属 LACF/AF 时如何切 §123.16 例外与 Subpart A 义务
  - 识别 4-1-25 Edition 是 CFR 年度编纂版次而非 2025 新规
  - 判断哪些问题超出本包（part 120/1240/108/110/507、NSSP、BAM、Import Alert 全文；CP 7303.842 自 v4.11 起已收，转 CAP-24）；FDA 海产品危害与控制指南自 v4.10 起已收，危害分析判定链转 CAP-23
