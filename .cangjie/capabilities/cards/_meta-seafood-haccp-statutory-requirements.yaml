source_label: 21 CFR Part 123（4-1-25 Edition，9 页 / 13 条款，GPO 双栏印刷版经 .cangjie/convert_cfr_part.py 重排）+ 21 CFR Part 117 法规正文〔§ 117.5(b)〕〔§ 117.1(c)〕（本包主来源）+ 21 CFR Part 113 / 114 法规正文（仅用于 §123.16 例外交叉，见 CAP-20）；21 CFR part 120 / 1240 / 108 / 110 / 507 正文、NSSP Guide 与 CP 7303.842 回指的 CPG / BAM 判据全文一律「转引未收」（CP 7303.842 检查程序正文自 v4.11 起已收于 CAP-24，但不得反推法条）；FDA《Fish and Fishery Products Hazards and Controls Guidance》第 4 版自 v4.10 起已收（第十五来源，见 CAP-23）；CP 7303.842 自 v4.11 起已收（第十六来源，见 CAP-24）；全包自 v4.12 起十七类不可混引（v4.10 时为十五类）