slug: fsvp-inspection-program
title: FSVP 进口商检查（CP 7303.878）与 Part 117 供应链程序分流
importance: extended
importance_rationale: 此前 supply-chain-verification 只覆盖接收设施在〔§ 117.135〕及 Subpart G 下的企业侧验证决策，进口商侧的 FSVP 轨道一直是明确列出的未收边界；用户随后提供 CP 7303.878 正文。补入后可同时纠正五类高频误读——① 把 FSVP 与 Part 117 供应链程序当成同一套义务；② 以为 deemed compliance 连 §1.509 入境标识一起免掉；③ 把 FSVP 检查按 CP 7303.050 准备样品；④ 把 Import Alert 99-41 与 LACF/AF 的 99-37/99-38 混为一谈；⑤ 把 CP 的检查动作写成企业法定义务或从 CP 反推 21 CFR part 1 subpart L 条文。它还给出 483a 观察分级、NAI/VAI/OAI、WL→99-41→§801(a)(3) 拒绝入境的执法阶梯与三条反直觉限制，属入口型判定能力，与 supply-chain-verification、regulatory-boundaries、inspection-readiness、inspection-sampling、investigator-authority-procedure、lacf-inspection-program 多卡交叉，故定 extended。
one_liner: 先判谁是 FSVPI、是不是 receiving facility 可走 deemed compliance（但 §1.509 不免），再按 CP 7303.878 看检查要哪些记录；FSVP 检查不取样、PART IV 全空；观察分级后走 483a → NAI/VAI/OAI → WL → Import Alert 99-41 Red List → §801(a)(3) 拒绝入境；21 CFR part 1 subpart L 正文转引未收。
intents:
  - 判断一个主体是不是 §1.500 定义的 FSVPI，以及无美国货主时谁承担进口商义务
  - 区分 FSVP（FD&C Act §805 / 21 CFR part 1 subpart L）与 Part 117 Subpart G 供应链程序（FD&C Act §418）的主体与法源
  - 解释 deemed compliance 的适用条件与「except they must comply with section 1.509」的例外
  - 回答不是 receiving facility 的纯贸易进口商、仓储设施为什么仍须完整履行 FSVP
  - 列出 §1.501(b)–(h) 的八类 FSVP 豁免并指出 part 120 正文未收（part 123 自 v4.9 起已收）
  - 区分 standard requirements（§1.502/503/504/505/506/508/509/510）与 modified requirements（§1.507/511/512/513）
  - 回答 §1.509 每一 entry line 的名称、邮箱、UFI（DUNS）电子申报义务
  - 处理 VSI / 小境外供应商 / 膳食补充剂 §1.511(c) / SRA §1.513 的适用判定与取证
  - 解释为什么 FSVP 检查不取样、PART IV 全空，不能套 CP 7303.050 的样品量与环境拭子
  - 复述检查员会索取的六组 FSVP 记录与 FDA 书面索取后及时提供记录的义务
  - 列出 PART V.1.A 的重大观察与较轻一档观察，并说明首次违法不默认优先执法
  - 解释 NAI / VAI / OAI 分类依据与 PART V.1.C 的八项执法裁量因素
  - 说明 §1.507 disclosure 不能替代 §801(b) / §1.95 reconditioning proposal 所需资料
  - 给出 §801(a)(3) / §1.514(a) 拒绝入境的官方指控措辞与 §301(zz) / §1.514(b) 禁止行为
  - 解释 direct reference authority 只在有限情形授予、其余案件须经 CMS 送 Center 并取得分类一致
  - 区分 Import Alert 99-41（FSVP）与 99-37 / 99-38（LACF/AF），说明 Red List 按「食品 + 供应商」组合列入与移除流程
  - 纠正「上了 99-41 就全部停运」与「未上 Red List 就自动禁运」两种相反误读
  - 回答 CP 7303.878 是不是 2025 年新规，以及 CP 7303.819 的准确状态
  - 判断哪些问题超出本包（21 CFR part 1 subpart L 正文、Import Alert 99-41 全文、FSVP Guidance、IP guidance tabs、HFP Enforcement Bulletin、part 111/112/120/507 正文（part 123 已收））
