  title: CP 7303.842 海产品检查程序整书导航与完整检查判定链（检查员作业层，与 Part 123 法条层、危害指南层配对）
  importance: extended
  importance_rationale: 本卡是第 16 类来源的入口型程序导航能力：把「检查优先级 → 检查类型分流 → HACCP 计划评价 → 取样与 PAC 上报 → PART IV 实验室判据 → PART V 执法分级 → FIELD
    REPORTING」串成完整判定链， 是用户问「FDA 海产品检查怎么查、查哪张表、报哪个码、会不会升级」时唯一承接卡。它与 CAP-22 的 21 CFR Part 123 法条义务层、CAP-23 的海产品危害分析技术指南层构成三层配对而非合并，
    并与 inspection-sampling、fsvp-inspection-program、lacf-inspection-program、inspection-readiness、 investigator-authority-procedure、chemical-hazard-controls、defect-action-levels
    双向分流。 它同时纠正三类最高频误读：① 把 CP 的检查动作、Table 1/2 优先级、PART IV 触发值写成企业 法定义务或产品放行标准；② 把 Table 4 的 Major/Minor 当 §123.6 显著性判定或自动执法结论；
    ③ 因 CP 非强制而把 Part 123 的 shall 义务稀释成可选。还须守住 7303.844 已合并但 PAC 仍分 进口/国产、03842H 同名不同义、documentary samples 只报 03842、ATTACHMENT
    A 样品量仅用于 surveillance and audit、Table 4 case-by-case、执法须 HFP OCE concurrence、物种误标 403(b) 与危害判定分离、2023 版 / 2025-09-30 更正的版本口径、转换件标题交错与表格不可逐字引用等
    边界，故定 extended。
  one_liner: 按「Table 1 产品/工艺风险 + Table 2 企业/进口商优先级 → 六类检查分流 → HACCP Program Evaluations → Sampling 三类与 PAC/PAF → PART IV A–G
    实验室分流与 CPG 判据出口 → PART V Table 4 分级与裁量 → FIELD REPORTING 收口」走完检查判定链；但全链只是给 field staff 的 内部作业指导层，凡法定义务回〔§ 123.xxx〕/ CAP-22、危害技术判定回
    CAP-23，十七类来源 不可混引，CPG / BAM / NSSP / Import Alert 等未收正文一律标转引未收。
  intents:
  - 复述 CP 7303.842 从检查优先级到报告上报的完整检查判定链
  - 说明 CP 7303.842 与 CP 7303.844 已合并为单一程序但 PAC 仍分进口国产
  - 判定某产品或工艺在 Table 1 的风险位置并处理表外产品
  - 判断产品跨 Table 1 多个类别时取最高风险类别
  - 用 Table 2 排检查先后并说明 90/10 与 100 entry line items 规则
  - 区分 Table 1 与 Table 2 的适用域并指出取样风险用哪张表
  - 分流 Processor Importer Vessels Foreign Establishment NSSP EMA 六类检查
  - 说明同一加工商同时适用多个 compliance program 时的处理顺序
  - 说明 HACCP Program Evaluations 须聚焦最高风险产品且在生产时进行
  - 说明未在生产时的替代取证与 OAI VAI 复检规则
  - 解释 Part 117 subparts C 与 G 不能替代 Part 123 的法定义务
  - 区分 significant observations 与自愿纠正项及 483 与 EIR 的列示顺序
