entry:
  name: fda-pchf-food-safety
  description: FDA 人类食品危害分析与基于风险的预防控制（PCHF / 21 CFR Part 117 / FSMA）技能，融合行业指南方法论与法规正文法定义务。当用户需要：做食品危害分析（六列工作表）、判定法定义务与法定豁免（条款级）、设计或验证热处理/工艺控制、设计过敏原控制与排产、环境病原（李斯特菌/沙门氏菌）与卫生控制策略、化学危害与经济掺假判定、供应商批准与验证活动选择、召回计划与报告食品义务、FDA
    食品法规适用边界判断、qualified facility 豁免撤销应诉（上诉/听证/时限）、美国食品安全计划（FSP）要素设计时触发。尤其覆盖 RTE 即食食品李斯特菌专项：抑制型（listeristatic）与致死型（listericidal）配方设计及验证、环境监测点位/频次/阳性升级决策树、卫生程序与清洁消毒作业、厂房分区与气流排水及设备卫生设计、人员手套与工服及动线控制、成品抽检与
    hold and test、储运温度控制。另覆盖 cGMP（21 CFR Part 117 Subpart B）合规资料分层与内审分诊：判断该看哪份官方文件、FDA 行业指南/小企业合规指南/执法口径文件的效力层级、Subpart B
    九条逐条取证要点、cGMP 与 PCHF 的分层关系、以及指南 should 与法规 must 的主体分流读法。另覆盖过敏原标签口径（FDA 食品过敏原问答 Ed.5，2025-01 修订终版）：Big 9 类别、Table 1 封闭树坚果清单、非牛乳/非鸡蛋的动物来源标注、allergen-free
    声明与 advisory 声明的互斥判别。另覆盖食品缺陷行动水平（FDA Food Defect Levels Handbook）：虫碎片/鼠毛/霉变等天然不可避免缺陷的 111 个产品阈值与 SIGNIFICANCE 判读、〔§ 117.110〕最低可行水平义务与掺混稀释禁令、110.110
    引用纠偏（v4.7 更正：Part 110 至今有效、正文未收）、表内无产品时的逐案评估，以及霉菌类缺陷与真菌毒素化学危害的联动分诊。另覆盖 FDA 现场检查迎检（CPGM 7303.040 现行版）：8 类检查与 PAC 码识别、Limited
    Scope / Full Scope / Focused PCHF 的取证深度与转换条件、〔§ 117.320〕official review 与〔§ 117.315(c)〕FSP 现场/24 小时记录举证矩阵、FDA 483 的 15
    个工作日回复骨架、eNSpect 观察项与 OAI/VAI/NAI 三层分级、OAI 后 6 个月跟进检查，以及 2020 版旧口径纠偏。另覆盖 FDA 现场取样（CP 7303.050，2022 签发 / 2025-09-10 更正）：PAC/PAF
    归属识别、Table 2/3 的产品样品 subs 数与 702(b) 部分、ATTACHMENT A 环境拭子 Listeria ≥50 / Salmonella ≥100 与 Zone 1–3 分区、湿干区目标菌选择、WGS 与 GenomeTrakr、ATTACHMENT
    A Part V 三档 Findings 与 PART V 表 7/8 的逐案执法响应清单、进口状态样品与 ATTACHMENT B 污秽/霉变抽样。另覆盖 FDA 检查员权限与文书（IOM 2026 Chapter 5）：FD&C Act
    704(a)(1) 与合理时间/合理方式、FDA 482/482c/482d/483/483a/484/4056 表单地图、境内预告 5 个日历日与境外通常提前告知的口径、拒绝入场/拒绝记录与 807(b) 拒绝入境后果、483 只写事实且不引法规原文也不引
    guidance 偏离的措辞纪律、non-reportable observations、15 个工作日双出处、电子记录与照片的证据固定规则，以及「样品合格不阻碍 cGMP 指控」。另覆盖低酸罐头与酸化食品检查（CP 7303.070，2024
    签发 / 2025-09-26 更正）：按〔§ 117.5(d)(1)(2)〕把 part 113 管辖的微生物危害与仍需 PCHF 的化学/物理/金葡危害切开、酸化食品不免 Subparts C/G 的分流、〔§ 117.1(c)〕专项
    CGMP 与 Part 117 并行、Keep Refrigerated 与 brites 的 program 路由、RRA 不是 704(a)(1) inspection 的法定地位、酸化食品判定三步与 Maximum Equilibrium
    pH、FCE/SID 与 Process Authority 及温度分布/热穿透/卷边/异常罐的取证清单、pH 4.40/4.65 双分析师规则与 4.6 法定边界的三套数字区分、24 罐/12 罐取样量、异常罐 1% 与 pH 4.75
    肉毒毒素升级、Import Alert 99-37/99-38 与「未备案本身不构成 DWPE」的反直觉限制。另覆盖低酸罐头与酸化食品的条款级法定义务（21 CFR Part 113 / 114 法规正文，4-1-25 Edition）：按〔§
    113.3(n)〕〔§ 114.3(b)(d)〕的成品平衡 pH 4.6 / aw 0.85 判定 LACF / AF / 酸性食品身份，〔§ 117.1(c)〕专项 CGMP 与 Part 117 并行、〔§ 117.5(d)(1)(2)〕双条件且仅限微生物危害的有限豁免、part
    114 不在豁免清单内、〔§ 114.5〕并列 parts 110 and 117 的掺假判据，Part 113 的 §113.10/40/60/81/83/87/89/100 与 Part 114 的 §114.10/80/83/89/90/100
    义务清单，成品 pH >4.0 用电位法〔§ 114.80(a)(2)〕、酸化不等于免除热处理〔§ 114.80(a)(1)〕、§114.89 三条偏差路径、scheduled process 的 FDA 调阅权〔§ 113.87(b)〕、两
    part 记录保存口径差异（§113.100(g)(h) 1+2 年且可用 part 11 电子记录；§114.100(e) 整段 3 年且无 part 11 条款），以及 4.6/0.85/4.0 法定数字与 CP 7303.070
    的 4.40/4.65 检查员触发线、L.mono ≤4.4/≤0.92 建议层基准的三层区分。另覆盖海产品 HACCP 的条款级法定义务（21 CFR Part 123 法规正文，4-1-25 Edition）：按〔§ 123.3(d)(e)(k)〕判定
    fish / fishery product 与 processing 范围及 (k)(2) 三项排除，〔§ 123.5(a)〕Part 110/117 默认适用与〔§ 117.5(b)〕双条件豁免（并指出该款无 part 113 §117.5(d)(2)
    的微生物危害限缩），〔§ 123.15〕〔§ 123.20〕Subpart B/C 的 augments 叠加而非替代，〔§ 123.6〕危害分析与 HACCP 计划及 (c)(1) 九项危害考虑清单、〔§ 123.7〕纠正措施三条路径、〔§
    123.8〕验证含 1 周记录复审与至少每年复审、〔§ 123.9〕记录分类 1 年/2 年与即时报录、〔§ 123.10〕培训课程等效或岗位经验、〔§ 123.11〕SSOP 的 should 与监测记录的 shall 之别及八项卫生条件、〔§
    123.16〕熏制水产品肉毒控制覆盖货架期且 except 仅排 part 113/114 管辖者、〔§ 123.28〕双壳贝类源头控制与 tag 五要素、〔§ 123.12〕进口商二选一与 affirmative steps 及拒绝入境后果，并区分
    §123.12 与 FSVP 双轨互不替代、三套记录期口径不可串用。另覆盖 FSVP 进口商检查（CP 7303.878，2023 版 / 2025-08-28 更正）：按 §1.500 判定 FSVPI 身份、FSVP（FD&C Act
    §805 / 21 CFR part 1 subpart L）与 Part 117 Subpart G 供应链程序的主体分流、deemed compliance 但不免 §1.509 每一 entry line 的 UFI/DUNS 申报、§1.501
    八类豁免与 standard / modified requirements 分节、FSVP 检查不取样与 PART IV 全空、483a 观察分级与 NAI/VAI/OAI、§801(a)(3) 拒绝入境与 §301(zz) 禁止行为、Warning
    Letter → Import Alert 99-41 Red List 加/删名单与「未上 Red List 仍可进口」等反直觉限制。另覆盖海产品危害分析与控制的完整判定链（FDA《Fish and Fishery Products
    Hazards and Controls Guidance》第 4 版 June 2022，技术指南层）：18 步 HACCP 计划开发流程、Ch.3 品种相关与工艺相关危害三表与 Ch.4–21 联动、在**无控制条件下**按 reasonably
    likely to occur 逐步判定显著性且 Yes/No 均须书面写理由、显著不等于本步设 CCP、Appendix 3 判定树定 CCP、control strategy example 的 CCP 位置漂移、关键限值可替代但须科学论证充分性、监控四问
    What/How/Frequency/Who，以及组胺与寄生虫等建议参数适用边界和『指南非强制 vs Part 123 法定义务』双向分流。另覆盖海产品检查程序的完整判定链（FDA CP 7303.842，2023 版 / 2025-09-30
    更正，检查程序作业层）：CP 7303.842 与 7303.844 已合并但 PAC 仍分进口/国产、Table 1 产品/工艺风险与 Table 2 企业/进口商 work planning 的分工及 90/10 规则、六类检查分流（Processor
    / Importer / Vessels / Foreign Establishment / NSSP / EMA）与 HACCP Program Evaluations、Sampling 三类与国产 for cause only、PAC
    双码表与 03842H 同名不同义、PART IV A–G 实验室分流与『触发值不是法规限值』、Table 4 违规分级与 case-by-case、WL / DWPE / judicial actions 的 HFP OCE concurrence、Species
    misbranding 的 FD&C Act 403(b) 定性、FIELD REPORTING 的 FACTS / CMS / FDA 3501·3502 出口、ATTACHMENT A 样品量适用域，以及十七类来源不可混引与三层配对（法条
    CAP-22 / 指南 CAP-23 / 检查程序 CAP-24）。另覆盖 LACF／酸化食品的紧急许可控制与注册备案（21 CFR Part 108 法规正文，4-1-25 Edition，11 页 / 9 条款）：把「手续层」与「实体层」分开——Subpart
    A（§108.3/.5/.6/.7/.10/.12/.19）给许可裁定（3 个工作日异议、5 个工作日听证、听证后 5 个工作日裁定）、紧急性健康危害下的立即生效、许可签发或拒绝（10 个工作日可再延 10）、中止与恢复（立即中止 +
    10 个工作日答复）、无证生产的产品扣留与事先书面批准（须证明 free from microorganisms of public health significance，20 个工作日答复）、以及「全部满足才豁免」的许可豁免；Subpart
    B 给注册（Form FDA 2541，首次从事后 10 天内，外国加工者报检前）与工艺备案（酸化食品 2541e / LACF 2541d·2541f·2541g，注册后 60 天内且包装新产品前）、停业 90 天通知、腐败与偏差报告、LACF
    独立的微生物污染报告、召回程序文件、BPCS 受训主管、记录保存（108.25(g) 整段 3 年 vs 108.35(h) 1+2 年）。**核心纠偏：紧急许可不是常态义务**——108.25(a)/108.35(a) 均为 `may
    be required`，未履行义务只构成 `prima facie basis`；Subpart A 全是 working days、Subpart B 全是日历天，不可互换；外国加工者走 §801 拒绝入境而非紧急许可；108.35
    独有的 FSIS 连续检验豁免、加州视为合规与 FOIA 豁免不得套到酸化食品。适用于食品工厂质量/合规人员、采购与供应商管理者、食品工艺研发、跨境食品贸易合规咨询，以及需要准备 FDA 现场检查、取样配合、483 回应与低酸/酸化罐头产品管辖判定的团队。
  core_principles:
  - 先分层再引用：**法规正文层自 v4.9 起含四套独立编号**——21 CFR Part 117〔§ 117.xxx〕、Part 113〔§ 113.xxx〕、Part 114〔§ 114.xxx〕、Part 123〔§ 123.xxx〕，均为最终规则、具法律约束力，各管各自义务；FDA
    行业指南（草案，should 级方法论建议）为另一层。冲突时法规为准，指南只作解释与例证；「Part 117 是唯一判定基准」只能理解为**判定 Part 117 义务**的唯一基准，不能解释成全包唯一法条
  - 危害分析做错或漏识别，整个 FSP 无效——无论执行得多好；判定必须书面，解释 No 与解释 Yes 同等重要
  - 危害判定分三层级：hazard → potential hazard（附录 X 标记仅为起点）→ hazard requiring a preventive control，最终责任在每个工厂
  - 判 No（不构成需控危害）与判 Yes 但不实施预防控制（§ 117.136 五情形出口）是两层不同的事，混层会得出错误结论
  - 发现点不等于控制点：在识别出危害的步骤之外控制往往是更优解（六列工作表第 6 列）
  - RTE 食品包装前暴露于环境且包装后无致死处理，必须评估环境病原体（117.130(c)(1)(ii)）；法定'环境病原'明确排除产芽孢菌芽孢
  - 热处理只杀营养细胞不灭孢子、不消除已形成毒素；控制目标用 D/z 值与 6D 削减倍数表达（L. mono 70°C/2min；非蛋白分解 C. botulinum 90°C/10min）
  - 监控四问（What/How/How often/Who）；发现偏差应假定自上次合格检查起全部未受控；记录审查是 7 个工作日不是 7 天
  - correction vs corrective action 的法定分诊是两条并列通道：过敏原交叉接触/卫生控制的条件与实践不一致（及时纠正即可）、轻微且孤立不影响安全的问题
  - 检测只能作为供应商验证的补充手段（这是指南的保守解读，法规未禁止其作唯一手段）；SAHCODH 危害要求首次使用前 + 每年现场审核，除非书面认定替代方案
  - 湿/干环境二分法决定环境病原战略：湿区防李斯特菌靠保持干燥，干区防沙门氏菌靠严格控水
  - FSP 至少每 3 年再分析；变更、新危害信息、意外问题、控制无效均触发（可限于相关部分）；FDA 也可指令再分析
  - 法定义务常带硬时限与法定出口：豁免日历、15/90/120 日窗口、7 工作日记录审查——答复前先查条款，别凭印象给数
  - 本技能有三层权威，先分层再引用：21 CFR Part 117 法规正文（最终规则，must 级法定义务，标注〔§ 117.xxx〕）；FDA PCHF 行业指南（草案，should 级方法论）；FDA《Control of Listeria
    monocytogenes in RTE Foods》(2017-01 Draft，一律 we recommend，建议层)。第三层指南正文出现 must 时，均是该指南在引述 Part 117 的法定义务——不得把建议层内容升格为法定义务
  - 两套 pH/aw 基准用途不同、不得互相替换：pH 4.6 / aw 0.85 是 Part 117 酸化食品管辖边界与安全水分水平（法定/通用口径）；pH ≤4.4 / aw ≤0.92 是 L.mono 抑制型配方设计基准（2017
    草案建议层）。同一个 0.92 在芽孢萌发视角与李斯特菌营养细胞生长视角下含义不同
  - 抑制 ≠ 杀灭：listeristatic 只承诺阻止生长（货架期重复生长研究增幅 <1 log），listericidal 才承诺破坏活菌并使成品达到 <0.04 CFU/g 的不可检出性；两者都不能简化成'pH 低'或'有热处理'一句话
  - 工艺闭环之外还有环境闭环：listericidal 工艺无法解决工艺后再污染，环境病原防线（工程控制、卫生程序、环境监测、人员卫生）须与工艺控制成对设计
  - 成品检测与环境监测方向相反：成品应检 L. monocytogenes，环境常规监测检 Listeria spp. 以指示定殖；成品检 spp. 阳性须判定是否 L. mono，否则按 L. mono 污染处理
  - cGMP 合规资料按四层效力栈使用：Part 117 法规正文（唯一判定基准）＞ FDA 小企业合规指南 SECG（2016-10，白话转述、明确允许替代方案、不创设义务）＞ 专项行业指南（草案建议层）＞ CPG/Compliance
    Programs（检查视角，非企业义务清单）；合规结论必须能回指〔§ 117.xxx〕，禁止把指南 should 写成 must
  - cGMP 是观察型结果义务：adequate 的法定定义见〔§ 117.3〕，法规不给数值只给结果；检查看现场状态、实际运行与必要记录，完美的 FSP 不能抵现场卫生失守；cGMP 失守对应 FD&C Act § 402(a)(3)/(4)
    掺假认定，与 Subparts C–G 的 prohibited act 是两条不同执法钩子
