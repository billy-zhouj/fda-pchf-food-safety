  - 分流条款级判定至 CAP-22 与危害判定至 CAP-23
  - 分流 FSVP 至 fsvp-inspection-program 与通用取样至 inspection-sampling
  - 纠正把 CP 检查动作写成企业法定义务的误读
  - 纠正把 CP 优先级表或违规分级当合规清单的误读
  - 纠正因 CP 非强制而把 Part 123 shall 义务稀释成可选的反向误读
