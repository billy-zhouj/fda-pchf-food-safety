    FDA 指南（should 建议层）＞ CPGM / CP / IOM 检查程序（检查员视角）。既不把 CP 的检查动作、Table 1/2 优先级、PART IV 触发值写成企业义务或放行标准，也不因 CP 非强制把 Part 123
    的 `shall` 义务稀释成可选
