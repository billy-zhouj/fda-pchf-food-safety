  - Big 9 的食物类别未变，变的是类别内的物种口径：树坚果以 Ed.5 Table 1 的 12 种封闭清单为准（官方全文未点名 coconut，仅规定未列入表者不得进 Contains、但仍须按通用名列入配料表）；milk 含牛/山羊/绵羊及其他反刍动物，eggs
