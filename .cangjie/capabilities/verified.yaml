  - 按 PART IV A 至 G Project 分流实验室分析并给出判据出口编号
  - 判断组胺 500 50 35 ppm 各自触发什么动作
  - 判断 Indole 15 25 微克每 100 克与感官 unanimous decision 的角色
  - 说明 RTE 活虫零容忍与 fish in the round 及 dried fish 排除项
  - 说明 pH 小于 4.6 与大于等于 4.6 在腌渍海产品追加分析中的作用
  - 说明天然毒素超限后的通知路径与 action level 出处
  - 说明净重过镀冰 48 subs 与 AOAC 963.18 及 CPG 562.300 的关系
  - 解释物种鉴定 Table 3 的 Lab Class 1 与 3 及 8 subs per lot
  - 判断某个 CP 阈值能否写成法规限值放行标准或 BAM 方法全文
