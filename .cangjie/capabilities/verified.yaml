    A–G 与 CPG 判据出口 → PART V Table 4 ranking（case-by-case）→ FIELD REPORTING 收口』推进；Table 4 的 Major/Minor 不是〔§ 123.6〕的 significant
    hazard 判定，WL / DWPE / judicial actions 也不是达到某值自动触发
