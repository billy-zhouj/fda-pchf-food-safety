      2025 新规；SOURCE 为 42 FR 14334, Mar. 15, 1977, unless otherwise noted。**法条定位**：Part 108 是 FD&C Act §404 的实施细则（AUTHORITY
      21 U.S.C. 342, 344, 371），与 CAP-20 的 Part 113/114 构成「手续层 + 实体层」同一链条——Subpart A（108.3/.5/.6/.7/.10/.12/.19）给许可裁定/撤销/签发/中止/无证生产/豁免程序，Subpart
      B（108.25 酸化食品 / 108.35 LACF）给注册（Form FDA 2541，首次从事后 10 天内，外国加工者报检前）与工艺备案（2541e / 2541d / 2541f / 2541g，注册后 60 天内且包装新产品前）。**最易错处**：紧急许可是
