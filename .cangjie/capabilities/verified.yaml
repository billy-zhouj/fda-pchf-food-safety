    20 个工作日）；Subpart B 申报时限全是日历天（注册 10 天、备案 60 天、停业通知 90 天、工艺变更报送 30 天、延期批复 30 个工作日）。记录保存四套口径不得合并：108.25(g) 整段 3 年自生产日、108.35(h)
    厂内 ≥1 年 + 另 2 年、113.100(g) 1+2 且可用 part 11 电子记录、114.100(e) 整段 3 年无 part 11 条款
