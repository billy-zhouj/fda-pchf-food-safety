    / AOAC / MPM、Import Alert 16-xx 与 99-41 全文、21 CFR part 1 subpart L、IOM Ch.4、FDA 3501/3502 表单全文一律标「转引未收」；引用写「CP 7303.842
    PART x / Table x / ATTACHMENT A #x / Lxxx」，不得与〔§ 123.xxx〕或 Seafood Hazards Guide Ch.x 混引'
  - CP 7303.842 的版本口径锁定 2023-11-01 版 / 2025-09-30 更正，文件名 20250929 只是 PDF 生成日，封面 Date of Issuance 09/30/025 为文本层残缺，正文页脚 11/1/2023；与
    CP 7303.050 / 7303.070 / 7303.878 同属旧程序更正本，不得套 CPGM 7303.040 的 2025-CPM-HFP-001 Transmittal 形态。转换件书签标题与正文伪标题交错（PART 各出现两次、H1
    虚高 133），检索以 PART / 小节 / 表号为准，表格、页码、页眉不可逐字引用；凡法条义务转 CAP-22、危害技术判定转 CAP-23、FSVP 转 CAP-21、通用取样转 CAP-17
  - 回答 LACF／酸化食品的许可问题不得把紧急许可写成常态义务：108.25(a)／108.35(a) 的 `may be required` 触发前提是未履行注册、备案、报告、召回程序、BPCS 主管与记录义务，且只构成 `prima
    facie basis`；不得把 Subpart A 的 working days（3/5/10/20）套到 Subpart B 的日历天（10/30/60/90）上；不得把 108.25(g) 的整段 3 年与 108.35(h) 的
    1+2 年、113.100(g) 的 1+2 年、114.100(e) 的整段 3 年合并成「3 年」一句；不得把外国加工者的 §801 拒绝入境路径（108.25(j)／108.35(k)）与国内企业的紧急许可路径混答；不得把 108.35
    独有的 FSIS 连续检验豁免 (i)、加州视为合规 (j)(2)、FOIA 豁免 (l) 套到酸化食品上
  - Part 108 的引用写「〔§ 108.xxx〕」并与〔§ 113.xxx〕〔§ 114.xxx〕〔§ 117.xxx〕〔§ 123.xxx〕并列，不得混编号；108.25(a) 的 `§§ 114.10, 114.80(a) (1)
    and (2), and (b), 114.83, 114.89, and 114.100 (b), (c), and (d)` 不得简写成「§§ 114.10–114.100」（印刷版括号内空格是原文形态，简写即失去逐字性）；备案 `Filing
    of this information does not constitute approval` 不得读成「等 FDA 批准才能生产」；108.35(c)(2)(ii) 的「升参数不算变更」与 (c)(2)(iii) 的「operating
    process 不算修改」不得反推为「任何工艺调整都无需报告」——降初温／降杀菌温度／缩短时间／改配方仍须事前证实 + 30 天内报送
